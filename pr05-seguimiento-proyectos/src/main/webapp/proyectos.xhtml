<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>PR05 - Proyectos (Web 2.0 - JSF/PrimeFaces)</title>
</h:head>

<h:body>
    <h:form id="formProyectos">

        <p:growl id="mensajes" showDetail="true" />

        <p:panel header="Nuevo proyecto">
            <h:panelGrid columns="2" cellpadding="5">

                <p:outputLabel for="nombre" value="Nombre *" />
                <p:inputText id="nombre" value="#{proyectoBean.nombre}" required="true"
                             requiredMessage="El nombre es obligatorio." />

                <p:outputLabel for="descripcion" value="Descripcion" />
                <p:inputTextarea id="descripcion" value="#{proyectoBean.descripcion}" rows="3" />

                <p:outputLabel for="fechaInicio" value="Fecha de inicio *" />
                <p:calendar id="fechaInicio" value="#{proyectoBean.fechaInicio}"
                            pattern="yyyy-MM-dd" required="true"
                            requiredMessage="La fecha de inicio es obligatoria." />

            </h:panelGrid>

            <p:commandButton value="Crear proyecto" action="#{proyectoBean.crear}"
                              update="formProyectos" process="@form" />
        </p:panel>

        <p:separator />

        <p:panel header="Proyectos registrados">
            <p:dataTable id="tablaProyectos" var="p" value="#{proyectoBean.proyectos}"
                         emptyMessage="No hay proyectos registrados todavia.">

                <p:column headerText="ID">
                    <h:outputText value="#{p.id}" />
                </p:column>

                <p:column headerText="Nombre">
                    <h:outputText value="#{p.nombre}" />
                </p:column>

                <p:column headerText="Descripcion">
                    <h:outputText value="#{p.descripcion}" />
                </p:column>

                <p:column headerText="Fecha inicio">
                    <h:outputText value="#{p.fechaInicio}">
                        <f:convertDateTime pattern="yyyy-MM-dd" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Estado">
                    <h:outputText value="#{p.estado}" />
                </p:column>

                <p:column headerText="Tareas">
                    <h:link outcome="tareas" value="Ver tareas">
                        <f:param name="proyectoId" value="#{p.id}" />
                    </h:link>
                </p:column>

            </p:dataTable>
        </p:panel>

    </h:form>
</h:body>
</html>
