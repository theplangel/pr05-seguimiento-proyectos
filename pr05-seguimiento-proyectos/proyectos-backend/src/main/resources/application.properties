spring.application.name=proyectos-api

# PostgreSQL: variables de entorno suministradas por Docker Compose.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:proyectos}
spring.datasource.username=${DB_USER:proyectos}
spring.datasource.password=${DB_PASSWORD:proyectos_local_2026}

# Flyway crea el esquema y los datos de prueba; Hibernate solo valida.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC

server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI (Swagger UI en /swagger-ui.html, contrato en /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS para desarrollo local (ng serve). Con Docker Compose no se usa.
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:4200}
