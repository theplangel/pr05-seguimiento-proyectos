spring.application.name=proyectos-api

# PostgreSQL: variables de entorno suministradas por Docker Compose. SIN contraseña por defecto (P07).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:proyectos}
spring.datasource.username=${DB_USER:proyectos}
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea el esquema y los datos de prueba; Hibernate solo valida.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC

server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI: DESACTIVADO por defecto (P07). Para desarrollo local: SWAGGER_ENABLED=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Hora en UTC para columnas TIMESTAMPTZ (P06)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- P06: fuente IoT ---
# Clave del dispositivo (cabecera X-API-Key). Sin valor por defecto: si IOT_API_KEY falta, la ingesta responde 401 a todo.
iot.api-key=${IOT_API_KEY:}
# Reglas de análisis (ver docs/decisiones-p06.md)
iot.umbral.advertencia=30
iot.umbral.critico=35
iot.rango.min=-10
iot.rango.max=80
iot.salto.max=8
iot.desconexion.segundos=15
iot.desconexion.revision-ms=5000

# --- P07: seguridad ---
# Usuarios iniciales: se crean al arrancar (si no existen) con BCrypt. Contraseñas OBLIGATORIAS (>= 12 caracteres), sin valores por defecto.
app.usuarios.lider.nombre=${APP_LIDER_USUARIO:lider}
app.usuarios.lider.password=${APP_LIDER_PASSWORD:}
app.usuarios.integrante.nombre=${APP_INTEGRANTE_USUARIO:integrante}
app.usuarios.integrante.password=${APP_INTEGRANTE_PASSWORD:}
# Freno a la fuerza bruta: 5 fallos en 60 s para el mismo usuario -> 429
seguridad.login.max-fallos=5
seguridad.login.ventana-segundos=60
# Límites de tamaño de petición
server.max-http-header-size=16KB
server.tomcat.max-swallow-size=64KB
