openapi: 3.0.3
info:
  title: Proyectos API (PR05 - Seguimiento de proyectos estudiantiles)
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      tags: [Salud]
      summary: Indica que el servicio está activo
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
  /api/proyectos:
    get:
      tags: [Proyectos]
      summary: Lista los proyectos, opcionalmente filtrados por estado
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Estado' }
      responses:
        '200':
          description: Lista de proyectos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Proyecto' }
        '400': { $ref: '#/components/responses/Error400' }
    post:
      tags: [Proyectos]
      summary: Registra un proyecto (inicia en REGISTRADO)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProyectoRequest' }
      responses:
        '201':
          description: Proyecto creado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proyecto' }
        '400': { $ref: '#/components/responses/Error400' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/proyectos/{id}:
    get:
      tags: [Proyectos]
      summary: Consulta un proyecto por id
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Proyecto encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proyecto' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/proyectos/{id}/estado:
    patch:
      tags: [Proyectos]
      summary: Cambia el estado respetando las transiciones permitidas
      description: |
        REGISTRADO -> EN_PROGRESO -> EN_REVISION -> ENTREGADO.
        EN_REVISION puede regresar a EN_PROGRESO. ENTREGADO es final.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstadoRequest' }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proyecto' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
components:
  schemas:
    Estado:
      type: string
      enum: [REGISTRADO, EN_PROGRESO, EN_REVISION, ENTREGADO]
    Salud:
      type: object
      properties:
        status: { type: string, example: UP }
        servicio: { type: string, example: proyectos-api }
        timestamp: { type: string, format: date-time }
    ProyectoRequest:
      type: object
      required: [titulo, descripcion, integrantes, asesor]
      additionalProperties: false
      properties:
        titulo: { type: string, maxLength: 120 }
        descripcion: { type: string, maxLength: 500 }
        integrantes: { type: string, maxLength: 250 }
        asesor: { type: string, maxLength: 120 }
    EstadoRequest:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado: { $ref: '#/components/schemas/Estado' }
    Proyecto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        titulo: { type: string }
        descripcion: { type: string }
        integrantes: { type: string }
        asesor: { type: string }
        estado: { $ref: '#/components/schemas/Estado' }
        estadosPermitidos:
          type: array
          items: { $ref: '#/components/schemas/Estado' }
        fechaCreacion: { type: string, format: date-time }
        fechaActualizacion: { type: string, format: date-time }
    Error:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        mensaje: { type: string }
        ruta: { type: string }
        campos:
          type: object
          additionalProperties: { type: string }
  responses:
    Error400:
      description: Entrada inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error404:
      description: Proyecto inexistente
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error409:
      description: Conflicto (transición no permitida o título duplicado)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
