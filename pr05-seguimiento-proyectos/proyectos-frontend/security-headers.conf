# P07: cabeceras de seguridad comunes a todas las respuestas del frontend.
# Nginx NO hereda los add_header del bloque server en un location que declara su propio add_header
# (p. ej. Cache-Control), así que este archivo se incluye en server y en cada location con add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Con TLS (proxy inverso HTTPS delante) añade además:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
