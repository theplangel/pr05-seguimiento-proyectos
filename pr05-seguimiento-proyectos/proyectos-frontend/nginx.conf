server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La API se sirve por el mismo origen: el navegador no necesita CORS.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre (outputHashing: all): se pueden cachear sin riesgo.
  location ~* \.(?:js|css|ico|png|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # Rutas del router de Angular (/proyectos, /proyectos/5): siempre devuelven index.html sin caché.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
