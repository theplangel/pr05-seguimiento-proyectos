server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # P07: configuración segura
  server_tokens off;
  client_max_body_size 64k;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # Con TLS (proxy inverso HTTPS delante) añade además:
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La API se sirve por el mismo origen: el navegador no necesita CORS.
  # P06: la ingesta IoT (POST) NO se expone por el puerto público del frontend; el dispositivo
  # habla con el backend por la red interna. La consulta (GET) del dashboard sí pasa.
  location = /api/iot/lecturas {
    if ($request_method = POST) { return 403; }
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre (outputHashing: all): se pueden cachear sin riesgo.
  location ~* \.(?:js|css|ico|png|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # Rutas del router de Angular (/proyectos, /proyectos/5): siempre devuelven index.html sin caché.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
